server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA: todo a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → gateway
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    # Streaming de video: NUNCA bufferear — el navegador necesita Range requests
    location ~* ^/api/job/[^/]+/(stream|download)$ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header Accept-Ranges bytes always;
    }

    # Videos del historial: también sin buffer
    location ~* ^/api/videos/.+$ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header Accept-Ranges bytes always;
    }

    # Proxy WebSocket /ws → gateway
    location /ws/ {
        proxy_pass http://gateway:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
