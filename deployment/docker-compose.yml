# deployment/docker-compose.yml

services:

  # ─── Classifier API (modelo EfficientNet-B0) ────────────────────────
  classifier_api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.classifier
    container_name: classifier_api
    ports:
      - "8000:8000"
    volumes:
      - ../src/backend/models:/app/models:ro
      - ../src/backend/classifier_api:/app/classifier_api
      - ../src/backend/shared:/app/shared
      - ../src/backend/database:/app/database
    command: ["uvicorn", "classifier_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Backend Gateway (YOLO + FastAPI) ───────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    container_name: frutvision_gateway
    ports:
      - "8080:8080"
    depends_on:
      classifier_api:
        condition: service_healthy
    volumes:
      - ../src/backend/models:/app/models:ro
      - ../src/backend/data:/app/data
      - ../src/frontend/uploads:/app/frontend/uploads
      # ── Montar código fuente en vivo (como classifier_api) ──
      # Cualquier cambio Python → solo necesitas: docker-compose restart gateway
      - ../src/frontend/backend:/app/frontend/backend
      - ../src/frontend/__init__.py:/app/frontend/__init__.py
      - ../src/backend/shared:/app/shared
      - ../src/backend/database:/app/database
      - ../src/backend/models:/app/models
    command: ["uvicorn", "frontend.backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
      - CLASSIFIER_HOST=http://classifier_api
      - CLASSIFIER_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  detector_agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.detector
    container_name: detector_agent
    depends_on:
      classifier_api:
        condition: service_healthy
    volumes:
      - ../src/backend/models:/app/models:ro
      - ../src/backend/detector_agent:/app/detector_agent
      - ../src/backend/shared:/app/shared
      - ../src/backend/database:/app/database
      - ../src/backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CLASSIFIER_HOST=http://classifier_api
      - CLASSIFIER_PORT=8000
    restart: unless-stopped
    command: ["python", "-m", "detector_agent.main"]

  # ─── Frontend (React + Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
    container_name: frutvision_frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fruit_ai_network
