# deployment/docker-compose.yml

services:

  # ─── Backend Gateway (YOLOv8s Multi-task) ───────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    container_name: frutvision_gateway
    ports:
      - "8080:8080"
    volumes:
      - ../src/backend/models:/app/models:ro
      - ../src/backend/data:/app/data
      - ../frontend/uploads:/app/frontend/uploads
      - ../src/frontend/backend:/app/frontend/backend
      - ../src/frontend/__init__.py:/app/frontend/__init__.py
      - ../src/backend/detector_agent:/app/detector_agent
      - ../src/backend/shared:/app/shared
      - ../src/backend/database:/app/database
    command: ["uvicorn", "frontend.backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ─── Frontend (React + Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
    container_name: frutvision_frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fruit_ai_network
